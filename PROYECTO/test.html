            .field-wrapper .form-control {

                padding-right: 2.75rem; /* espacio para icono derecho/ojito */

            }

            .field-icon-left,
            .field-icon-right,
            .toggle-password {
                position: absolute;

            }

            .field-icon-left {

                background-repeat: no-repeat;
                background-color: transparent;
                position: relative;

            /* Opcional: capa oscura para mejorar legibilidad */
            .login-card::before {

    <body class="bg-light">
        
        <!-- Contenedor centrado -->
        <div class="container d-flex justify-content-center align-items-center min-vh-100">
            <div class="card shadow p-5 login-card">    
            <h2 class="text-center mb-4">Iniciar Sesión</h2>
            
            <!-- Alert -->
            <div class="alert alert-danger" role="alert">
                Usuario incorrecto, esto con php
            </div>

            <!-- Formulario -->
            <form action="autentificacion.php" method="POST">
                
                <!-- Correo -->
                <div class="mb-3">
                    <label for="login_email" class="form-label">Correo electrónico</label>
                    <div class="field-wrapper">
                        <i class="bi bi-envelope-fill field-icon-left"></i>
                        <input type="email"
                            class="form-control form-control-lg"
                            id="login_email"
                            name="login_email"
                            placeholder="ejemplo@correo.com"
                            required>
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="mb-3">
                    <label for="login_password" class="form-label">Contraseña</label>
                    <div class="field-wrapper">
                        <i class="bi bi-lock-fill field-icon-left"></i>
                        <input type="password"
                            class="form-control form-control-lg"
                            id="login_password"
                            name="login_password"
                            placeholder="********"
                            required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i id="toggleIcon" class="bi bi-eye-fill"></i>
                        </button>
                    </div>
                </div>

                <!-- Botón login -->
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
                </div>
            </form>

            <!-- Enlace registro -->
            <div class="text-center mt-4">
                <small>¿No tienes cuenta? <a href="registro.php">Regístrate aquí</a></small>
            </div>
            </div>
        </div>

        
        <!-- Script para mostrar/ocultar contraseña -->
        <script>
            function togglePassword() 
            {
                const input = document.getElementById("login_password");
                const icon = document.getElementById("toggleIcon");

                if (input.type === "password") 
                {
                    input.type = "text";
                    icon.classList.remove("bi-eye-fill");
                    icon.classList.add("bi-eye-slash-fill");

                } else 
                {
                    input.type = "password";
                    icon.classList.remove("bi-eye-slash-fill");
                    icon.classList.add("bi-eye-fill");
                }
            }
        </script>
